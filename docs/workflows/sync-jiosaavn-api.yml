name: Sync Upstream JioSaavn API

on:
  schedule:
    # Automatically syncs latest upstream commits from https://github.com/sumitkolhe/jiosaavn-api.git every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-jiosaavn-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VIBEX repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm ci --prefix jiosaavn-api --omit=dev --ignore-scripts
          npm ci --prefix music-app --ignore-scripts

      - name: Sync & compile latest sumitkolhe/jiosaavn-api
        run: node scripts/sync-jiosaavn-api.mjs

      - name: Check if API code changed beyond sync timestamp
        id: check
        run: |
          if git diff --quiet -- jiosaavn-api/src api music-app; then
            git checkout -- jiosaavn-api/upstream.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify full test suite & production build
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm test --prefix music-app
          npm run build --prefix music-app

      - name: Commit & push updated JioSaavn API to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jiosaavn-api
          git commit --no-verify -m "chore(api): auto-sync upstream sumitkolhe/jiosaavn-api"
          git push origin main

      - name: Trigger production redeploy & warm live song endpoints
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$DEPLOY_HOOK" >/dev/null || true
          fi
          curl -fsSL "https://vibex-music-pi.vercel.app/api/content/new-releases?languages=tamil,hindi,english,telugu,malayalam&limit=12" >/dev/null || true
          curl -fsSL "https://vibex-music-pi.vercel.app/api/content/trending?languages=tamil,hindi,english,telugu,malayalam&limit=12" >/dev/null || true
