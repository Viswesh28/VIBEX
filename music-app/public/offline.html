<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>VIBEX — Offline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    background: radial-gradient(560px 420px at 50% 18%, rgba(225, 29, 60, .18), transparent 68%), #09090b;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .badge {
    width: 88px; height: 88px; margin: 0 auto 22px;
    border-radius: 26px;
    background: linear-gradient(150deg, #ff3752, #8f0d20);
    box-shadow: 0 22px 50px -20px rgba(225, 29, 60, .9);
    display: grid; place-items: center;
  }
  svg { display: block; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: .16em; }
  p { max-width: 340px; margin: 12px auto 0; color: #b9b9c2; font-size: 15px; line-height: 1.6; }
  button {
    margin-top: 26px; min-height: 46px; padding: 0 26px;
    border: 0; border-radius: 999px;
    background: #e11d3c; color: #fff;
    font: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="#fff">
        <rect x="3.6" y="7.4" width="3.1" height="9.2" rx="1.55" />
        <rect x="10.45" y="3.6" width="3.1" height="16.8" rx="1.55" />
        <rect x="17.3" y="7.4" width="3.1" height="9.2" rx="1.55" />
      </svg>
    </div>
    <h1>VIBEX</h1>
    <p>You're offline. Your saved library is still here — reconnect to search and stream.</p>
    <button type="button" onclick="location.replace('/')">Try again</button>
  </main>
</body>
</html>
