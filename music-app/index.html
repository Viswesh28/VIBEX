<!-- Home-screen web app. `black` gives the status bar + Dynamic Island a
     stable dark canvas with white glyphs; the document itself starts below
     it, so no control can hide behind the island. `black-translucent` would
     extend under it but leaves unreadable white glyphs in light mode. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />

<title>VIBEX — Music Player</title>
<style>html, body { margin: 0; background: var(--vibex-boot-bg, #09090b); }</style>
<script>
  // Paint the saved theme before the bundle loads. Without this a light-theme
  // user sees a black frame on every cold launch of the installed app.
  try {
    if (localStorage.getItem('svTheme') === 'light') {
      document.documentElement.classList.add('light')
      document.documentElement.style.setProperty('--vibex-boot-bg', '#f7f7f9')
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', '#f7f7f9')
    }
  } catch (error) {}
</script>
